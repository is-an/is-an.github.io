<header class="site-header v2-header">
  <div class="header-inner v2-header-inner">

    <a class="logo v2-logo" href="/" data-i18n-aria-label="header_home" aria-label="is-an 홈">
      <img src="/logo.png" alt="" class="logo-img v2-logo-img" width="28" height="28">
      <span class="v2-wordmark">is-an</span>
    </a>

    <nav class="main-nav v2-nav" id="mainNav" data-i18n-aria-label="header_navigation" aria-label="주요 메뉴">
      <a href="/guide/" class="nav-link" data-route="tech">tech</a>
      <a href="/tools/" class="nav-link" data-route="tools">tools</a>
      <a href="/faq/" class="nav-link" data-route="etc">etc</a>
    </nav>

    <div class="header-actions v2-header-actions">
      <button type="button" class="v2-header-search" id="headerSearch"
              data-i18n-aria-label="home_searchLabel" aria-label="도구 검색" aria-haspopup="dialog" aria-expanded="false">
        <span class="v2-header-search-icon" aria-hidden="true"></span>
      </button>

      <button type="button" id="themeToggle" class="theme-toggle v2-icon-btn" aria-label="다크모드로 전환">
        <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
      </button>

      <div class="lang-switch v2-lang">
        <button
          type="button"
          id="langToggle"
          class="lang-toggle v2-lang-toggle"
          aria-haspopup="listbox"
          aria-expanded="false"
          data-i18n-aria-label="common.language"
          aria-label="언어 선택">
          <svg class="v2-language-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>
          <span class="lang-current" id="langCurrent">한국어</span>
        </button>
        <ul class="lang-dropdown v2-lang-dropdown" id="langDropdown" role="listbox" data-i18n-aria-label="common.language" aria-label="언어 선택">
          <li role="option" data-lang="ko" tabindex="0">한국어</li>
          <li role="option" data-lang="en" tabindex="0">English</li>
          <li role="option" data-lang="zh" tabindex="0">中文</li>
          <li role="option" data-lang="ja" tabindex="0">日本語</li>
        </ul>
      </div>
    </div>
  </div>
</header>
