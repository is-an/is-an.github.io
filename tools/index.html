<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      try {
        var storedTheme = localStorage.getItem('theme');
        var theme = (storedTheme === 'light' || storedTheme === 'dark')
          ? storedTheme
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <title data-i18n="directory_meta_title">모든 도구 · 계산기·게임·로또·사주 | is-an</title>
  <meta name="description" data-i18n-content="directory_copy" content="계산기, 변환기, 게임, 로또와 사주를 한곳에서 찾아보세요. 기존 기능을 모두 모았습니다.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://is-an.github.io/tools/">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/v2.css">
  <link rel="stylesheet" href="../assets/css/tool-directory.css">
</head>
<body class="v2-page tool-directory">
  <div id="site-header"></div>
<main>
  <section class="v2-hero">
    <div class="v2-container">
      <h1 class="v2-h1" data-i18n="directory_title">모든 도구</h1>
      <p class="v2-lede" data-i18n="directory_copy">계산기, 변환기, 게임, 로또와 사주를 한곳에서 찾아보세요. 기존 기능을 모두 모았습니다.</p>
      <form class="v2-search" role="search" onsubmit="return false;">
        <label class="v2-visually-hidden" for="toolSearch" data-i18n="home_searchLabel">도구 검색</label>
        <input type="search" id="toolSearch" class="v2-search-input" autocomplete="off" data-i18n-placeholder="home_searchPlaceholder" placeholder="도구 검색... (예: BMI, 연봉, 로또)">
        <button type="button" class="v2-search-btn" id="toolSearchBtn" data-i18n="home_searchButton">검색</button>
      </form>
    </div>
  </section>
  <div class="v2-home-body">
    <section class="v2-section" aria-labelledby="indexTitle">
      <div class="v2-section-head">
        <h2 class="v2-h2" id="indexTitle" data-i18n="home_index_title">전체 도구</h2>
        <span class="v2-note" id="indexCount" aria-live="polite"></span>
      </div>
      <div class="v2-empty" id="emptyState" hidden>
        <p class="v2-empty-title" data-i18n="home_empty_title">검색 결과가 없습니다</p>
        <p class="v2-empty-copy" data-i18n="home_empty_copy">다른 검색어를 입력하거나 전체 도구를 살펴보세요.</p>
        <button type="button" class="v2-primary-btn" id="clearSearchBtn" data-i18n="home_empty_action">전체 도구 보기</button>
      </div>
      <div class="v2-index-grid" id="toolIndex"></div>
      <noscript><p><a href="../cal/" data-i18n="nav.calculator">계산기</a> · <a href="../games/" data-i18n="nav.games">게임</a> · <a href="../lotto/" data-i18n="nav.lotto">로또</a> · <a href="../saju/" data-i18n="nav.saju">사주</a></p></noscript>
      <p class="v2-trust"><a href="../guide/" data-i18n="nav.guide">설명서</a> · <a href="../faq/" data-i18n="nav.faq">자주 묻는 질문</a> · <a href="../privacy/" data-i18n="footer.privacy">개인정보처리방침</a></p>
    </section>
  </div>
</main>
  <div id="ads-slot" class="ads-slot"></div>
  <div id="site-footer"></div>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/header-nav.js"></script>
<script src="../assets/js/tools-data.js"></script>
<script src="../assets/js/tool-directory.js"></script>
</body>
</html>
